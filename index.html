<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flipbook PDF Dinamico</title>
  <style>
    body {
      background: #ccc;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #flipbook {
      width: 800px;
      height: 600px;
    }
    #flipbook .page {
      width: 400px;
      height: 600px;
      background: white;
      display: inline-block;
      margin: 0 2px;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div id="flipbook"></div>

<!-- LIBRERIE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://www.turnjs.com/lib/turn.min.js"></script>

<script>
  const url = 'https://www.example.com/tuo_pdf.pdf'; // URL del tuo PDF (deve essere un URL accessibile direttamente)

  const flipbook = document.getElementById('flipbook');

  // Imposta worker per PDF.js
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Carica e visualizza il PDF
  pdfjsLib.getDocument(url).promise.then(pdf => {
    const totalPages = pdf.numPages;

    // Funzione per renderizzare una pagina
    const renderPage = (pageNum) => {
      return pdf.getPage(pageNum).then(page => {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Renderizza la pagina sul canvas
        return page.render({ canvasContext: context, viewport: viewport }).promise.then(() => {
          const pageDiv = document.createElement('div');
          pageDiv.classList.add('page');
          pageDiv.appendChild(canvas);
          flipbook.appendChild(pageDiv);
        });
      });
    };

    // Renderizza tutte le pagine
    const renderAllPages = async () => {
      for (let i = 1; i <= totalPages; i++) {
        await renderPage(i);
      }

      // Inizializza flipbook dopo che tutte le pagine sono state aggiunte
      $('#flipbook').turn({
        width: 800,
        height: 600,
        autoCenter: true,
        display: 'single', // 'double' per visualizzazione a due pagine
        when: {
          turning: function(event, page, view) {
            console.log('Pagina: ' + page);
          }
        }
      });
    };

    renderAllPages();
  }).catch(error => {
    console.error('Errore nel caricare il PDF:', error);
  });
</script>

</body>
</html>
