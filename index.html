<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PDF Sfogliabile</title>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://www.turnjs.com/lib/turn.min.js"></script>
  <style>
    body {
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #flipbook {
      width: 800px;
      height: 600px;
    }
    #flipbook .page {
      width: 400px;
      height: 600px;
      background: white;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div id="flipbook">
  <div class="page"><iframe src="https://raw.githubusercontent.com/me-pdf/test/5e456387f3e86cf3cdbad3c212821b37e8e9e453/L31_2024_2_v1.pdf#page=1"></iframe></div>
  <div class="page"><iframe src="https://raw.githubusercontent.com/me-pdf/test/5e456387f3e86cf3cdbad3c212821b37e8e9e453/L31_2024_2_v1.pdf#page=2"></iframe></div>
  <div class="page"><iframe src="https://raw.githubusercontent.com/me-pdf/test/5e456387f3e86cf3cdbad3c212821b37e8e9e453/L31_2024_2_v1.pdf#page=3"></iframe></div>
  <div class="page"><iframe src="https://raw.githubusercontent.com/me-pdf/test/5e456387f3e86cf3cdbad3c212821b37e8e9e453/L31_2024_2_v1.pdf#page=4"></iframe></div>
</div>

<script>
  $("#flipbook").turn({
    width: 800,
    height: 600,
    autoCenter: true
  });
</script>

</body>
</html>
